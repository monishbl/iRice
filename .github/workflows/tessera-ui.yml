# Builds Tessera's Rust programs, tessera-ui and tessera-events, so nobody has
# to compile them: tools/native-install.py downloads the build for the exact
# version being installed or updated to, checks it and swaps it in
# (docs/releases.md).
#
# NOT THE RELEASE BUILDER TODAY: the GitHub account's Actions are locked
# (billing), so releases are made by the release builder instead: server1
# builds (tools/release-builder/tessera-release), the user's laptop signs and
# publishes (tools/release-builder/publish-release), each every 10 minutes
# (docs/releases.md, "The release builder"). They make exactly what this
# workflow made. So that the two never publish the same tree twice (two
# builds of one tree differ byte for byte, and a manifest from one with an
# archive from the other is refused by every install), this workflow only
# runs by hand now (workflow_dispatch). While Actions are locked even that
# just fails to start. The push trigger it had is kept below, commented out:
# turn it back on only after stopping both timers (systemctl --user disable
# --now tessera-release.timer on server1, tessera-publish.timer on the laptop).
#
# When:  a push to main that touches native/ (the Stable channel: the
#        rolling prerelease tessera-ui-latest), a push to beta that does (the
#        Beta channel: the rolling prerelease tessera-ui-beta), and every tag
#        v* (the tag's own release). (Path filters don't apply to tags: every
#        tag builds.) The installer looks in its channel's rolling release
#        first, then the other's: builds are named by the native/ tree, so a
#        version promoted from beta to main finds its build in either.
# Where: an Arch Linux container, so the libraries match Arch users'.
# What:  two variants with the full release profile (LTO, one codegen unit):
#        x86-64-v3 (AVX2 processors, about 2015 on) and generic (any x86-64).
# Out:   per variant tessera-ui-<tree>-<variant>.tar.zst (both programs); one
#        tessera-ui-<tree>.manifest.json (commit, tree, version, and each
#        variant's file, size and sha256, and each program's); a minisign
#        signature (.minisig) of each. <tree> is the git tree of native/
#        (git rev-parse HEAD:native): a commit that changes only QML needs no
#        new build, and the installer finds this one by that name.
# Kept:  each rolling release keeps the three newest builds of its branch
#        and deletes older ones, so an older commit's build is soon gone: installs
#        of it build locally instead (the fallback). A tag keeps its builds as
#        long as its release exists.
# Signs: with the secrets TESSERA_UI_MINISIGN_KEY (the secret key file's
#        contents) and TESSERA_UI_MINISIGN_PASSWORD; installs check against
#        tools/tessera-ui.pub. Without the key or the .pub it still builds,
#        then says in the log that it skipped signing and publishing.
#        One-time setup: docs/releases.md.
# Mirror: with the secret GITLAB_TOKEN, the same files (signatures too) go to
#        the GitLab mirror's generic package registry (tessera-ui/<tag>), the
#        second place installs look; without it, skipped (docs/releases.md,
#        "Mirrors"). The code itself: gitlab-mirror.yml.
name: tessera-ui
on:
  # push:
  #   branches: [main, beta]
  #   tags: ["v*"]
  #   paths: ["native/**", ".github/workflows/tessera-ui.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tessera-ui-${{ github.ref }}
  # (a newer push to a branch makes an older run's build pointless; tags finish)
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' }}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: x86-64-v3
            rustflags: "-C target-cpu=x86-64-v3"
          - variant: generic
            rustflags: ""
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Tools and libraries
        run: pacman -Syu --noconfirm --needed git rust zstd jq pkgconf libxkbcommon wayland fontconfig
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Name the sources
        id: src
        run: |
          echo "tree=$(git rev-parse HEAD:native)" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/tessera-ui/target
            native/tessera-events/target
          key: cargo-arch-${{ matrix.variant }}-rust${{ steps.src.outputs.rustc }}-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            cargo-arch-${{ matrix.variant }}-rust${{ steps.src.outputs.rustc }}-
      # TODO(PGO): stable tags could add a profile-guided build: build with
      # RUSTFLAGS="-Cprofile-generate=/tmp/pgo", run a scripted workload
      # headless (needs a Wayland compositor in CI, e.g. a nested headless
      # one, never a real display), merge with llvm-profdata, then rebuild
      # with -Cprofile-use. Not built yet: measure the gain first
      # (docs/benchmarks-baseline.md).
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # (what tessera-ui --version and Settings → About say: native/tessera-ui/build.rs)
          TESSERA_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref == 'refs/heads/beta' && 'beta' || 'stable' }}
          TESSERA_BUILD_VARIANT: ${{ matrix.variant }}
          TESSERA_BUILD_KIND: release
        run: |
          cargo build --release --locked --manifest-path native/tessera-ui/Cargo.toml --bin tessera-ui
          cargo build --release --locked --manifest-path native/tessera-events/Cargo.toml
      - name: Pack
        env:
          TREE: ${{ steps.src.outputs.tree }}
          VARIANT: ${{ matrix.variant }}
          EPOCH: ${{ steps.src.outputs.epoch }}
        run: |
          set -euo pipefail
          mkdir -p stage out
          cp native/tessera-ui/target/release/tessera-ui native/tessera-events/target/release/tessera-events stage/
          # (--version only, and never with a display)
          ui_version=$(env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET -u DISPLAY stage/tessera-ui --version)
          ev_version=$(env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET -u DISPLAY stage/tessera-events --version)
          file="tessera-ui-$TREE-$VARIANT.tar.zst"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$EPOCH" -C stage -cf - tessera-ui tessera-events \
            | zstd -q -19 -T0 -o "out/$file"
          jq -n --arg file "$file" --arg sha "$(sha256sum "out/$file" | cut -d' ' -f1)" --argjson size "$(stat -c %s "out/$file")" \
            --arg ui_sha "$(sha256sum stage/tessera-ui | cut -d' ' -f1)" --arg ui_version "$ui_version" \
            --arg ev_sha "$(sha256sum stage/tessera-events | cut -d' ' -f1)" --arg ev_version "$ev_version" \
            '{file: $file, sha256: $sha, size: $size,
              programs: {"tessera-ui": {sha256: $ui_sha, version: $ui_version},
                         "tessera-events": {sha256: $ev_sha, version: $ev_version}}}' > "out/variant-$VARIANT.json"
          cat "out/variant-$VARIANT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: out/
          retention-days: 7

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git jq minisign github-cli
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: out
          merge-multiple: true
      - name: Manifest
        id: manifest
        run: |
          set -euo pipefail
          tree=$(git rev-parse HEAD:native)
          # (a tag: its own release; beta: the Beta channel's rolling one;
          # main, or a run by hand from any other branch: Stable's)
          case "$GITHUB_REF" in
            refs/tags/*)       channel=release tag="$GITHUB_REF_NAME" ;;
            refs/heads/beta)   channel=beta tag=tessera-ui-beta ;;
            *)                 channel=stable tag=tessera-ui-latest ;;
          esac
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' native/tessera-ui/Cargo.toml | head -1)
          jq -n --arg commit "$GITHUB_SHA" --arg tree "$tree" --arg version "$version" --arg channel "$channel" --arg tag "$tag" \
            --arg built "$(date -u +%FT%TZ)" --slurpfile v3 out/variant-x86-64-v3.json --slurpfile generic out/variant-generic.json \
            '{format: 1, name: "tessera-ui", commit: $commit, tree: $tree, version: $version, channel: $channel, tag: $tag,
              built: $built, variants: {"x86-64-v3": $v3[0], "generic": $generic[0]}}' > "out/tessera-ui-$tree.manifest.json"
          rm out/variant-*.json
          cat "out/tessera-ui-$tree.manifest.json"
          { echo "tree=$tree"; echo "channel=$channel"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
      - name: Is there a signing key?
        id: key
        env:
          KEY: ${{ secrets.TESSERA_UI_MINISIGN_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::warning title=Built, not signed or published::There's no TESSERA_UI_MINISIGN_KEY secret yet, so these builds are neither signed nor published (installs build tessera-ui locally meanwhile). One-time setup: docs/releases.md"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          elif [[ ! -s tools/tessera-ui.pub ]]; then
            echo "::warning title=Built, not signed or published::tools/tessera-ui.pub isn't committed yet, so nobody could check a signature: not signed or published. One-time setup: docs/releases.md"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign
        if: steps.key.outputs.ready == 'yes'
        env:
          KEY: ${{ secrets.TESSERA_UI_MINISIGN_KEY }}
          PASSWORD: ${{ secrets.TESSERA_UI_MINISIGN_PASSWORD }}
          TREE: ${{ steps.manifest.outputs.tree }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/tessera-ui.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          for f in out/*.tar.zst out/*.manifest.json; do
            # (the trusted comment is signed too: installs check tree= in it)
            printf '%s\n' "$PASSWORD" | minisign -S -s "$key" -m "$f" -t "$(basename "$f") tree=$TREE commit=$GITHUB_SHA"
            # Checked against the committed public key: a key and .pub that
            # don't belong together never get published
            minisign -V -q -p tools/tessera-ui.pub -m "$f"
          done
          ls -l out
      - name: Publish
        if: steps.key.outputs.ready == 'yes'
        env:
          TREE: ${{ steps.manifest.outputs.tree }}
          TAG: ${{ steps.manifest.outputs.tag }}
          CHANNEL: ${{ steps.manifest.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == release ]]; then
            gh release view "$TAG" >/dev/null 2>&1 ||
              gh release create "$TAG" --verify-tag --title "Tessera $TAG" --notes "Tessera $TAG. Its ready-made tessera-ui is below (docs/releases.md)."
            gh release upload "$TAG" out/* --clobber
            exit 0
          fi
          branch=$([[ "$CHANNEL" == beta ]] && echo beta || echo main)
          notes="Rolling builds of tessera-ui from $branch (the ${CHANNEL^} channel), for tools/native-install.py (docs/releases.md). Newest: $GITHUB_SHA (native/ tree $TREE). The three newest builds are kept; older ones are deleted."
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "tessera-ui ($branch, rolling)" --notes "$notes"
          gh release upload "$TAG" out/* --clobber
          gh release edit "$TAG" --notes "$notes"
          # Only the three newest builds stay (by their manifests' upload time)
          old=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | test("^tessera-ui-[0-9a-f]{40}\\.manifest\\.json$"))]
                | sort_by(.createdAt) | reverse | .[3:] | .[].name | capture("^tessera-ui-(?<t>[0-9a-f]{40})").t')
          for t in $old; do
            [[ "$t" == "$TREE" ]] && continue
            for name in $(gh release view "$TAG" --json assets --jq ".assets[].name | select(startswith(\"tessera-ui-$t\"))"); do
              gh release delete-asset "$TAG" "$name" --yes
            done
          done
      # The same files, signatures included, on the GitLab mirror (the
      # second place tools/native-install.py looks, checked the same way):
      # its generic package registry, package tessera-ui, the tag as the
      # version. Without the GITLAB_TOKEN secret: skipped, not failed.
      - name: Mirror to GitLab
        if: steps.key.outputs.ready == 'yes'
        # (GitHub's release is already out: a mirror that fails is a warning)
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT || vars.GITLAB_PROJECT || 'monishbl/tessera' }}
          TREE: ${{ steps.manifest.outputs.tree }}
          TAG: ${{ steps.manifest.outputs.tag }}
          CHANNEL: ${{ steps.manifest.outputs.channel }}
        run: |
          set -euo pipefail
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "::notice title=GitLab mirror skipped::There's no GITLAB_TOKEN secret, so the builds aren't copied to GitLab. One-time setup: docs/releases.md (Mirrors)"
            exit 0
          fi
          api="https://gitlab.com/api/v4/projects/$(jq -rn --arg p "$GITLAB_PROJECT" '$p | @uri')"
          hdr="PRIVATE-TOKEN: $GITLAB_TOKEN"
          for f in out/*; do
            curl --fail --silent --show-error --retry 3 --header "$hdr" --upload-file "$f" \
              "$api/packages/generic/tessera-ui/$TAG/$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          [[ "$CHANNEL" == release ]] && exit 0
          # A rolling one keeps the three newest builds there too (by their
          # manifests' upload time), and one copy of each file
          pkg=$(curl -fsS --header "$hdr" "$api/packages?package_type=generic&package_name=tessera-ui&per_page=100" |
                jq -r --arg v "$TAG" '[.[] | select(.version == $v)][0].id // empty')
          [[ -n "$pkg" ]] || exit 0
          files=$(curl -fsS --header "$hdr" "$api/packages/$pkg/package_files?per_page=100")
          # (the three newest trees, by their manifests, newest first)
          keep=$(jq -r '[.[] | select(.file_name | test("^tessera-ui-[0-9a-f]{40}\\.manifest\\.json$"))] | sort_by(.created_at) | reverse
                        | map(.file_name | capture("^tessera-ui-(?<t>[0-9a-f]{40})").t)
                        | reduce .[] as $t ([]; if index([$t]) then . else . + [$t] end) | .[:3] | .[]' <<<"$files" | xargs)
          keep="$keep $TREE"
          # Removed: older trees' files, and older copies of a file uploaded again
          seen=" "
          jq -r 'sort_by(.created_at) | reverse | .[] | "\(.id) \(.file_name)"' <<<"$files" | while read -r id name; do
            t=$(sed -nE 's/^tessera-ui-([0-9a-f]{40}).*/\1/p' <<<"$name")
            if [[ " $keep " != *" $t "* || "$seen" == *" $name "* ]]; then
              curl -fsS --request DELETE --header "$hdr" "$api/packages/$pkg/package_files/$id" >/dev/null && echo "removed $name"
            fi
            seen="$seen$name "
          done
