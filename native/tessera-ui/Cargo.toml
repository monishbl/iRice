[package]
name = "tessera-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Tessera's interface in Rust (Slint on wlr-layer-shell), surface by surface beside the QML shell"
publish = false

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg", "unstable-fontique-011"] }
i-slint-core = "=1.18.1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # (settings written back keep their order)
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
material-colors = "0.5"
# (the wallpaper's seed: matugen's steps on the release matugen uses, src/seed.rs)
mc04 = { package = "material-colors", version = "0.4", features = ["image"] }
# (the one material-colors 0.4 already builds: clipboard pictures, GIF previews,
# app icons, the wallpaper's top for the menu bar's text colour)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
memmap2 = "0.9"
accesskit = "0.25"
accesskit_unix = "0.24"
calloop = { version = "0.14", features = ["signals"] }
wayland-client = "0.31"
# App icons as the shell draws them (src/appicon.rs): SVG decoding (resvg,
# already built for Slint; PNG through `image` above): no new crates
resvg = { version = "0.48", default-features = false }
# HTTP for the AI chat: blocking, small, no async runtime; rustls, certificates
# checked against the system's trust store (src/services/ai/mod.rs)
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] } # (src/bin/fake-ime.rs only)

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
