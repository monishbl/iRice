# The workspace: tessera-ui, the binary (src/main.rs, src/surfaces.rs: which
# surfaces there are), tessera-core (core/: the platform, the shell's shared
# state, the theme, the services) and one crate per surface (surfaces/<name>/).
# A change to one surface recompiles that crate and the binary, nothing else
# (docs/rust-ui-surfaces.md, "The workspace").
[workspace]
members = ["core", "surfaces/*", "host/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Every crate's versions, in one place (a crate names what it uses: `slint.workspace = true`)
[workspace.dependencies]
tessera-core = { path = "core" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg", "unstable-fontique-011"] }
slint-build = "=1.18.1"
i-slint-core = "=1.18.1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # (settings written back keep their order)
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
material-colors = "0.5"
# (the wallpaper's seed: matugen's steps on the release matugen uses, core/src/seed.rs)
mc04 = { package = "material-colors", version = "0.4", features = ["image"] }
# (the one material-colors 0.4 already builds: clipboard pictures, GIF previews,
# app icons, the wallpaper's top for the menu bar's text colour)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
memmap2 = "0.9"
accesskit = "0.25"
accesskit_unix = "0.24"
calloop = { version = "0.14", features = ["signals"] }
wayland-client = "0.31"
# App icons as the shell draws them (core/src/appicon.rs): SVG decoding (resvg,
# already built for Slint; PNG through `image` above): no new crates
resvg = { version = "0.48", default-features = false }
# HTTP for the AI chat: blocking, small, no async runtime; rustls, certificates
# checked against the system's trust store (core/src/services/ai/mod.rs)
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] } # (src/bin/fake-ime.rs only)
# Window pictures: Hyprland's toplevel export protocol, generated from
# core/protocols/ (core/src/services/capture.rs; already built for the protocols above)
wayland-scanner = "0.31"
wayland-backend = "0.3" # (what the generated code names)

[package]
name = "tessera-ui"
description = "Tessera's interface in Rust (Slint on wlr-layer-shell), surface by surface beside the QML shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tessera-core.workspace = true
slint.workspace = true
smithay-client-toolkit.workspace = true
serde_json.workspace = true
libc.workspace = true
memmap2.workspace = true
calloop.workspace = true
wayland-protocols-misc.workspace = true
# The surfaces, one crate each (a new one: its line here, its name in
# src/surfaces.rs's KNOWN and make(); `members` takes surfaces/* already)
tessera-menubar = { path = "surfaces/menubar" }
# The host (wave 4: the QML shell's services, in Rust; standalone only)
tessera-host-shell = { path = "host/shell" }
tessera-host-system = { path = "host/system" }
tessera-host-desktop = { path = "host/desktop" }
tessera-host-sharing = { path = "host/sharing" }
tessera-dock = { path = "surfaces/dock" }
tessera-emoji = { path = "surfaces/emoji" }
tessera-clipboard = { path = "surfaces/clipboard" }
tessera-osd = { path = "surfaces/osd" }
tessera-wallpaper = { path = "surfaces/wallpaper" }
tessera-today = { path = "surfaces/today" }
tessera-desktop = { path = "surfaces/desktop" }
tessera-notifications = { path = "surfaces/notifications" }
tessera-spotlight = { path = "surfaces/spotlight" }
tessera-controlcenter = { path = "surfaces/controlcenter" }
tessera-sidebar = { path = "surfaces/sidebar" }
tessera-screentools = { path = "surfaces/screentools" }
tessera-overview = { path = "surfaces/overview" }
tessera-missioncontrol = { path = "surfaces/missioncontrol" }
tessera-switcher = { path = "surfaces/switcher" }
tessera-stagemanager = { path = "surfaces/stagemanager" }
tessera-launchpad = { path = "surfaces/launchpad" }
tessera-tabs = { path = "surfaces/tabs" }
tessera-overlay = { path = "surfaces/overlay" }
tessera-welcome = { path = "surfaces/welcome" }
tessera-resources = { path = "surfaces/resources" }
tessera-cheatsheet = { path = "surfaces/cheatsheet" }
tessera-osk = { path = "surfaces/osk" }
tessera-hotcorners = { path = "surfaces/hotcorners" }
tessera-tiling = { path = "surfaces/tiling" }
tessera-decorations = { path = "surfaces/decorations" }
tessera-share = { path = "surfaces/share" }
tessera-appstore = { path = "surfaces/appstore" }
tessera-shelf = { path = "surfaces/shelf" }
tessera-network = { path = "surfaces/network" }
tessera-captions = { path = "surfaces/captions" }
tessera-notes = { path = "surfaces/notes" }
# (not a shell surface: main.rs hands --greeter to it; it isn't in KNOWN)
tessera-greeter = { path = "surfaces/greeter" }
tessera-lock = { path = "surfaces/lock" }
tessera-session = { path = "surfaces/session" }
tessera-polkit = { path = "surfaces/polkit" }
tessera-settings = { path = "surfaces/settings" }
# (wave 4b: the overlays that had no Rust version: corners, find-pointer ring, space-switch cue,
# display connect, identify and confirm, shelf probes; all standalone only)
tessera-screenfx = { path = "surfaces/screenfx" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
