# iRice: AirPlay speakers (Settings -> Sound -> AirPlay speakers). A small
# PipeWire client of its own, like PipeWire's pipewire-aes67.conf: it finds
# AirPlay (RAOP) speakers over mDNS (Avahi) and adds each one as an output.
# Run by services/AirPlay.qml as a user unit:
#   systemd-run --user --unit=irice-airplay pipewire -c <this file>
# Needs the pipewire-zeroconf package (the raop modules).
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { nice.level = -11 }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-raop-discover
        args = { }
    }
]
