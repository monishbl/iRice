# Tessera: terminal colours (Settings → Appearance → Match apps). Generated.
[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
[colors.selection]
background = "{{tessera.accent}}"
text = "#ffffff"
[colors.cursor]
cursor = "{{tessera.accent}}"
text = "{{colors.surface.default.hex}}"
[colors.normal]
black = "{{colors.surface_container_highest.default.hex}}"
red = "#{{tessera.red}}"
green = "#{{tessera.green}}"
yellow = "#{{tessera.yellow}}"
blue = "#{{tessera.blue}}"
magenta = "#{{tessera.magenta}}"
cyan = "#{{tessera.cyan}}"
white = "{{colors.on_surface_variant.default.hex}}"
[colors.bright]
black = "{{colors.outline.default.hex}}"
red = "#{{tessera.red}}"
green = "#{{tessera.green}}"
yellow = "#{{tessera.yellow}}"
blue = "#{{tessera.blue}}"
magenta = "#{{tessera.magenta}}"
cyan = "#{{tessera.cyan}}"
white = "{{colors.on_surface.default.hex}}"
